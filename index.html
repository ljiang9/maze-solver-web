<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>maze-solver-web · 迷宫生成与最短路</title>
<style>
  body { font-family:-apple-system,"PingFang SC",sans-serif; background:#f5f6f8; margin:0; padding:24px; color:#1f2329; }
  h1 { font-size:20px; }
  button { background:#2f6fed; color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; margin-right:8px; }
  button.ghost { background:#e5e7eb; color:#1f2329; }
  canvas { background:#fff; border:1px solid #ccc; margin-top:12px; }
  #msg { margin-top:10px; font-size:14px; color:#2f6fed; }
</style>
</head>
<body>
  <h1>迷宫生成与最短路</h1>
  <div>
    <button onclick="gen()">生成迷宫</button>
    <button onclick="solveAnim()" class="ghost">显示最短路</button>
  </div>
  <canvas id="cv" width="420" height="420"></canvas>
  <div id="msg"></div>

<!-- MAZE_LOGIC_BEGIN -->
<script>
// ===== 纯函数：迷宫生成(DFS)与 BFS 最短路（Node 断言）=====
// grid[r][c] = true 表示墙，false 表示可走。奇数尺寸，外框为墙。
function genMaze(cols, rows) {
  // DFS 回溯生成迷宫，cells 为可走点；返回二维布尔墙矩阵。
  const W = cols * 2 + 1, H = rows * 2 + 1;
  const grid = Array.from({length: H}, () => Array(W).fill(true));
  const visited = Array.from({length: rows}, () => Array(cols).fill(false));
  function carve(cx, cy) {
    visited[cy][cx] = true;
    grid[cy*2+1][cx*2+1] = false;
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]].sort(() => Math.random()-0.5);
    for (const [dx,dy] of dirs) {
      const nx = cx+dx, ny = cy+dy;
      if (nx>=0 && ny>=0 && nx<cols && ny<rows && !visited[ny][nx]) {
        grid[cy*2+1+dy][cx*2+1+dx] = false;
        carve(nx, ny);
      }
    }
  }
  carve(0,0);
  return grid;
}

function bfsShortest(grid, start, end) {
  // BFS 找 start->end 的最短路径，返回坐标数组（含两端）或 null。
  const H = grid.length, W = grid[0].length;
  const key = (r,c) => r*W+c;
  const prev = new Map();
  const q = [start];
  prev.set(key(start[0],start[1]), null);
  while (q.length) {
    const [r,c] = q.shift();
    if (r===end[0] && c===end[1]) break;
    for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nr=r+dr, nc=c+dc;
      if (nr<0||nc<0||nr>=H||nc>=W) continue;
      if (grid[nr][nc]) continue; // 墙
      if (!prev.has(key(nr,nc))) { prev.set(key(nr,nc), [r,c]); q.push([nr,nc]); }
    }
  }
  if (!prev.has(key(end[0],end[1]))) return null;
  const path = [];
  let cur = end;
  while (cur) { path.push(cur); cur = prev.get(key(cur[0],cur[1])); }
  return path.reverse();
}
// ===== MAZE_LOGIC_END =====

let maze = [];
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");

function gen() {
  maze = genMaze(10, 10);
  draw();
  document.getElementById("msg").textContent = "已生成迷宫（蓝框为墙，起点左上，终点右下）。";
}

function draw(path) {
  const H = maze.length, W = maze[0].length;
  const cell = cv.width / W;
  ctx.clearRect(0,0,cv.width,cv.height);
  for (let r=0;r<H;r++) for (let c=0;c<W;c++) {
    ctx.fillStyle = maze[r][c] ? "#333" : "#fff";
    ctx.fillRect(c*cell, r*cell, cell, cell);
  }
  if (path) {
    ctx.fillStyle = "#2f6fed";
    for (const [r,c] of path) ctx.fillRect(c*cell+cell*0.25, r*cell+cell*0.25, cell*0.5, cell*0.5);
  }
}

function solveAnim() {
  const path = bfsShortest(maze, [1,1], [maze.length-2, maze[0].length-2]);
  draw(path || []);
  document.getElementById("msg").textContent = path ? `最短路长度：${path.length} 步（蓝点）。` : "无通路。";
}

gen();
</script>
</body>
</html>
